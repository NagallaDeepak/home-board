name: Update weather and news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch weather and headlines
        run: python scripts/update.py data/board.json
      - name: Save if changed
        run: |
          git config user.name "board-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/board.json
          git diff --cached --quiet || (git commit -m "Update weather and news" && git push)

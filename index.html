<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: a home board — weather strip across the top, news below; stacks on a phone. Dark by design for the TV. */
:root {
  --bg: #111b24; --panel: #18242f; --panel-2: #213040; --ink: #e8eef2; --muted: #9db0bf; --line: #2c3d4d;
  --accent: #f2a93b; --accent-ink: #1a1206; --sky: #5cc8c2; --alert: #e5503f;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html { font-size: clamp(15px, 0.55vw + 11px, 22px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.45; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 1.1rem 2rem; max-width: 1900px; margin: 0 auto; display: grid; gap: 1.1rem; }
h1, h2, h4 { font-family: var(--display); margin: 0; letter-spacing: -0.01em; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem; color: var(--muted); font-weight: 700; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.6rem 1.6rem; }
.top h1 { font-size: 2.3rem; line-height: 1.05; }
.clock { font-family: var(--display); font-size: 2.3rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1.05; }
.right { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem; }
.updated { font-size: 0.85rem; color: var(--muted); }
.btn { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.5rem 1.1rem; font-weight: 700; min-height: 2.4rem; box-sizing: border-box; text-decoration: none; background: var(--accent); color: var(--accent-ink); }

.weather { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.9rem; }
.wcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem 1.1rem; display: grid; gap: 0.6rem; min-width: 0; align-content: start; }
.wtop { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; }
.wtop > div { min-width: 0; }
.wtop svg { width: 3.2rem; height: 3.2rem; color: var(--sky); flex: none; }
.wcity { font-family: var(--display); font-size: 1.25rem; font-weight: 700; }
.wregion { font-size: 0.8rem; color: var(--muted); }
.wtemp { margin-left: auto; text-align: right; }
.wtemp b { font-family: var(--display); font-size: 2.4rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.wtemp span { display: block; font-size: 0.8rem; color: var(--muted); }
.wdesc { font-size: 0.9rem; color: var(--muted); }
.wdays { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.3rem; border-top: 1px solid var(--line); padding-top: 0.55rem; }
.wday { text-align: center; font-size: 0.8rem; display: grid; gap: 0.1rem; justify-items: center; }
.wday svg { width: 1.5rem; height: 1.5rem; color: var(--sky); }
.wday .hl { font-variant-numeric: tabular-nums; }
.wday .hl em { font-style: normal; color: var(--muted); }
.wday .rain { color: var(--sky); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
.walert { background: var(--alert); color: #fff; border-radius: 8px; padding: 0.45rem 0.7rem; font-size: 0.85rem; font-weight: 700; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.15rem; display: grid; gap: 0.9rem; min-width: 0; }
.sec-head { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
.sec-head h2 { font-size: 1.45rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.tab { font: inherit; color: var(--ink); cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 0.35rem 0.85rem; font-weight: 700; font-size: 0.88rem; min-height: 2.2rem; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stories { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.9rem 1.4rem; margin: 0; padding: 0; list-style: none; }
.story { display: grid; gap: 0.25rem; align-content: start; padding-top: 0.7rem; border-top: 1px solid var(--line); min-width: 0; }
.story h4 { font-size: 1.1rem; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.story p { margin: 0; font-size: 0.92rem; color: var(--muted); }
.story .src { font-size: 0.76rem; color: var(--muted); display: flex; gap: 0.6rem; flex-wrap: wrap; }
.story a { color: var(--sky); }
.msg { color: var(--muted); }

@media (max-width: 1100px) { .weather { grid-template-columns: minmax(0, 1fr); } .stories { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .stories { grid-template-columns: minmax(0, 1fr); } .top h1, .clock { font-size: 1.8rem; } .right { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="dayName">Today</div>
      <h1 id="dateLong">Home Board</h1>
    </div>
    <div class="clock" id="clock" aria-label="Current time">--:--</div>
    <div class="right">
      <span class="updated" id="updated">Loading weather and news…</span>
      <a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Ask Claude</a>
    </div>
  </header>

  <section class="weather" id="weather" aria-label="Weather"></section>

  <section class="panel" aria-labelledby="newsH">
    <div class="sec-head"><h2 id="newsH">News</h2><div class="tabs" role="tablist" id="tabs"></div></div>
    <ul class="stories" id="stories"><li class="msg">Loading headlines…</li></ul>
  </section>
</div>

<script>
(function () {
  "use strict";
  var REGIONS = [["andhra", "Andhra Pradesh"], ["telangana", "Telangana"], ["india", "India"], ["usa", "USA"], ["world", "World"]];
  var state = { data: null, tab: "andhra", lastTap: 0 };
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function parse(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function tick() {
    var n = new Date();
    $("clock").textContent = n.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    $("dayName").textContent = n.toLocaleDateString(undefined, { weekday: "long" });
    $("dateLong").textContent = n.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  }

  var ICONS = {
    clear: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="9" fill="currentColor" fill-opacity=".18"/><path d="M24 5v5M24 38v5M5 24h5M38 24h5M10.6 10.6l3.5 3.5M33.9 33.9l3.5 3.5M37.4 10.6l-3.5 3.5M14.1 33.9l-3.5 3.5"/></svg>',
    partly: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="17" r="7"/><path d="M18 4v3M5 17h3M8.8 7.8l2.1 2.1M27.2 7.8l-2.1 2.1"/><path d="M16 38h20a7 7 0 0 0 0-14 10 10 0 0 0-19 3 5.5 5.5 0 0 0-1 11z" fill="currentColor" fill-opacity=".18"/></svg>',
    cloudy: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M13 37h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="currentColor" fill-opacity=".18"/></svg>',
    fog: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M8 18h32M6 25h36M10 32h28M14 39h20"/></svg>',
    rain: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 30h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="currentColor" fill-opacity=".18"/><path d="M16 35l-2 6M24 35l-2 6M32 35l-2 6"/></svg>',
    snow: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M13 29h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="currentColor" fill-opacity=".18"/><path d="M16 36v5M14 38.5h4M24 36v5M22 38.5h4M32 36v5M30 38.5h4"/></svg>',
    storm: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 29h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="currentColor" fill-opacity=".18"/><path d="M25 31l-5 7h7l-4 6"/></svg>'
  };
  function wkind(c) {
    if (c === 0) return ["clear", "Clear"]; if (c === 1) return ["clear", "Mostly clear"]; if (c === 2) return ["partly", "Partly cloudy"];
    if (c === 3) return ["cloudy", "Overcast"]; if (c === 45 || c === 48) return ["fog", "Fog"];
    if (c >= 51 && c <= 57) return ["rain", "Drizzle"]; if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return ["rain", c >= 65 || c === 82 ? "Heavy rain" : "Rain"];
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return ["snow", "Snow"]; if (c >= 95) return ["storm", "Thunderstorms"];
    return ["cloudy", "—"];
  }
  function icon(c) { var s = document.createElement("span"); s.style.display = "contents"; s.innerHTML = ICONS[wkind(c)[0]]; return s; }

  function renderWeather() {
    var box = $("weather"); box.textContent = "";
    (state.data.weather || []).forEach(function (w) {
      var card = el("article", "wcard"), top = el("div", "wtop");
      top.appendChild(icon(w.now.code));
      var name = el("div"); name.appendChild(el("div", "wcity", w.city)); name.appendChild(el("div", "wregion", w.region)); top.appendChild(name);
      var t = el("div", "wtemp"); t.appendChild(el("b", null, Math.round(w.now.t) + "°" + w.unit));
      t.appendChild(el("span", null, "Feels " + Math.round(w.now.feels) + "° · " + w.now.hum + "% humidity")); top.appendChild(t);
      card.appendChild(top);
      card.appendChild(el("div", "wdesc", wkind(w.now.code)[1] + " · wind " + Math.round(w.now.wind) + " mph"));
      if (w.alert) card.appendChild(el("div", "walert", w.alert));
      var days = el("div", "wdays");
      (w.days || []).slice(0, 5).forEach(function (d, i) {
        var dd = el("div", "wday");
        dd.appendChild(el("span", null, i === 0 ? "Today" : parse(d.date).toLocaleDateString(undefined, { weekday: "short" })));
        dd.appendChild(icon(d.code));
        var hl = el("span", "hl", Math.round(d.hi) + "° "); hl.appendChild(el("em", null, Math.round(d.lo) + "°")); dd.appendChild(hl);
        if (d.rain != null) dd.appendChild(el("span", "rain", d.rain + "% rain"));
        dd.title = wkind(d.code)[1]; days.appendChild(dd);
      });
      card.appendChild(days); box.appendChild(card);
    });
  }

  function renderTabs() {
    var tabs = $("tabs"); tabs.textContent = "";
    REGIONS.forEach(function (r) {
      var b = el("button", "tab", r[1]); b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(state.tab === r[0]));
      b.addEventListener("click", function () { state.tab = r[0]; state.lastTap = Date.now(); store("lrb.tab", r[0]); renderTabs(); renderNews(); });
      tabs.appendChild(b);
    });
  }
  function ago(iso) {
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (!(m >= 0)) return ""; if (m < 60) return m + " min ago"; var h = Math.round(m / 60); if (h < 36) return h + " h ago";
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function renderNews() {
    var list = $("stories"); list.textContent = "";
    var items = (state.data && state.data.news && state.data.news[state.tab]) || [];
    if (!items.length) { list.appendChild(el("li", "msg", "No recent headlines for this region.")); return; }
    items.forEach(function (s) {
      var li = el("li", "story");
      li.appendChild(el("h4", null, s.headline));
      if (s.summary) li.appendChild(el("p", null, s.summary));
      var src = el("div", "src"); src.appendChild(el("span", null, s.source + " · " + ago(s.time)));
      if (/^https:\/\//.test(s.link)) { var a = el("a", null, "Read"); a.href = s.link; a.target = "_blank"; a.rel = "noopener noreferrer"; src.appendChild(a); }
      li.appendChild(src); list.appendChild(li);
    });
  }

  function load() {
    var x = new XMLHttpRequest();
    x.open("GET", "data/board.json?t=" + Date.now());
    x.onload = function () {
      if (x.status !== 200) { $("updated").textContent = "Couldn’t load the latest weather and news. Retrying soon."; return; }
      try { state.data = JSON.parse(x.responseText); } catch (e) { return; }
      $("updated").textContent = "Updated " + new Date(state.data.updatedAt).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) + " · " + state.data.sources;
      renderWeather(); renderNews();
    };
    x.onerror = function () { $("updated").textContent = "Offline. Showing the last update; retrying soon."; };
    x.send();
  }

  var saved = store("lrb.tab"); REGIONS.forEach(function (r) { if (r[0] === saved) state.tab = saved; });
  tick(); setInterval(tick, 20000);
  renderTabs(); load();
  setInterval(load, 10 * 60 * 1000);                       // new data lands every 30 min
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000); // pick up page changes
  // On the TV nobody taps: rotate regions every 25 s unless someone chose one in the last 2 minutes.
  setInterval(function () {
    if (!state.data || Date.now() - state.lastTap < 120000) return;
    var i = 0; REGIONS.forEach(function (r, k) { if (r[0] === state.tab) i = k; });
    state.tab = REGIONS[(i + 1) % REGIONS.length][0]; renderTabs(); renderNews();
  }, 25000);
})();
</script>
</body>
</html>
